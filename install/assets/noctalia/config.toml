[accessibility]
ui_scale = 1.2

[bar.default]
background_opacity = 0.89
capsule_group = []
center = [ "spacer_1", "active_window" ]
concave_edge_corners = true
end = [ "tray", "notifications", "spacer_2", "volume", "spacer_1", "clock" ]
font_weight = 600
margin_edge = 0
margin_ends = 10
position = "bottom"
radius = 0
radius_bottom_left = 80
radius_bottom_right = 80
radius_top_left = 14
radius_top_right = 15
scale = 1.0
start = [ "temp", "sysmon_2", "sysmon_3", "media", "spacer_3", "workspaces" ]
thickness = 33
widget_spacing = 10

[brightness]
enable_ddcutil = true

[location]
address = "Santiago"

[osd.kinds]
media = false

[shell]
clipboard_image_action_command = "satty -f -"
font_family = "FiraCode Nerd Font"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.launcher]
    app_grid = true

        [shell.launcher.providers.session]
        global = true

        [shell.launcher.providers.windows]
        global = false

    [shell.panel]
    launcher_placement = "attached"
    open_near_click_control_center = false
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"

    [shell.screenshot]
    copy_to_clipboard = true
    filename_pattern = "Screenshot_%Y%m%d_%H%M%S"
    pipe_command = ""
    pipe_to_command = false
    save_to_file = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]

[widget.clock]
color = "secondary"
format = "{:%-I:%M %p}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
max_length = 139
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 2.5
capsule = false
capsule_fill = "on_primary"
inactive_pill_size = 1.0
label_source = "id"
pill_scale = 0.6
show_labels = false
