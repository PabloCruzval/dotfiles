# =============================================================================
# Tmux Configuration
# Prefix: C-a  (like screen, more ergonomic than default C-b)
# Theme:   Noctalia (via kitty ANSI colors)
# =============================================================================

# ---------------------------------------------------------------------------
# General settings
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g history-limit 5000
set -g mouse on
set -g focus-events on
set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
setw -g renumber-windows on

# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ---------------------------------------------------------------------------
# Keybindings (neovim-inspired)
# ---------------------------------------------------------------------------

# Splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize (Shift + vim keys)
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Window navigation
bind Tab next-window
bind S-Tab previous-window
bind -r C-h previous-window
bind -r C-l next-window
bind w choose-tree -Zs

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Rename session/window
bind R command-prompt -I "#S" "rename-session -- %%"
bind , command-prompt -I "#W" "rename-window -- %%"

# Misc
bind x kill-pane
bind X confirm-before -p "kill-session #S? (y/n)" kill-session
bind z resize-pane -Z
bind "{" swap-pane -U
bind "}" swap-pane -D

# ---------------------------------------------------------------------------
# Status bar
# ---------------------------------------------------------------------------
set -g status-position top
set -g status-style bg=default,fg=white
set -g status-justify left
set -g status-interval 5
set -g status-padding 1

set -g status-left "#[fg=magenta]┃ #S "
set -g status-left-length 40

set -g status-right "#(tmux-git-status)#[fg=brightblack] #H"
set -g status-right-length 80

setw -g window-status-format "#[fg=brightblack] ·#I:#W· "
setw -g window-status-current-format "#[fg=magenta,bold] ·#I:#W· "
setw -g window-status-separator ""
setw -g window-status-activity-style bg=default,fg=green

set -g status-format[1] "#[fg=brightblack]#{R:─}"

# ---------------------------------------------------------------------------
# Pane borders
# ---------------------------------------------------------------------------
set -g pane-border-style bg=default,fg=brightblack
set -g pane-active-border-style bg=default,fg=magenta

# Messages
set -g message-style bg=default,fg=white
set -g message-command-style bg=default,fg=white

# ---------------------------------------------------------------------------
# Plugins (TPM)
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect / Continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Yank
set -g @yank_action 'copy-pipe'

# TPM path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'

# Initialize TPM (MUST be at the bottom)
run '~/.local/share/tmux/plugins/tpm/tpm'
