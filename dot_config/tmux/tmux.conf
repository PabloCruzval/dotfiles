# =============================================================================
# Tmux Configuration
# Prefix: C-a  (like screen, more ergonomic than default C-b)
# Theme:   OpenCode default palette (warm orange, blue, purple)
# =============================================================================

# ---------------------------------------------------------------------------
# General settings
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g history-limit 5000
set -g mouse on
set -g focus-events on
set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
setw -g renumber-windows on

# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ---------------------------------------------------------------------------
# Keybindings (neovim-inspired)
# ---------------------------------------------------------------------------

# Splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize (Shift + vim keys)
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Window navigation
bind Tab next-window
bind S-Tab previous-window
bind -r C-h previous-window
bind -r C-l next-window
bind w choose-tree -Zs

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Rename session/window
bind R command-prompt -I "#S" "rename-session -- %%"
bind , command-prompt -I "#W" "rename-window -- %%"

# Misc
bind x kill-pane
bind X confirm-before -p "kill-session #S? (y/n)" kill-session
bind z resize-pane -Z
bind "{" swap-pane -U
bind "}" swap-pane -D

# ---------------------------------------------------------------------------
# Colors: OpenCode default palette
# ---------------------------------------------------------------------------
OC_BG="#0a0a0a"
OC_PANEL="#141414"
OC_ELEMENT="#1e1e1e"
OC_TEXT="#eeeeee"
OC_MUTED="#808080"
OC_PRIMARY="#fab283"
OC_SECONDARY="#5c9cf5"
OC_ACCENT="#9d7cd8"
OC_BORDER="#484848"
OC_SUCCESS="#7fd88f"
OC_WARNING="#f5a742"

# ---------------------------------------------------------------------------
# Status bar
# ---------------------------------------------------------------------------
set -g status-style bg=$OC_BG,fg=$OC_TEXT

# Left: session name
set -g status-left "#[bg=$OC_PRIMARY,fg=$OC_BG] #S #[bg=$OC_BG,fg=$OC_PRIMARY]"
set -g status-left-length 40

# Right: date
set -g status-right "#[fg=$OC_MUTED]%Y-%m-%d %H:%M"
set -g status-right-length 60

set -g status-justify left
set -g status-interval 60

# Window tabs
setw -g window-status-format "#[bg=$OC_ELEMENT,fg=$OC_MUTED] #I:#W "
setw -g window-status-current-format "#[bg=$OC_PRIMARY,fg=$OC_BG] #I:#W "
setw -g window-status-separator ""

# Activity
setw -g window-status-activity-style bg=$OC_ELEMENT,fg=$OC_SUCCESS

# ---------------------------------------------------------------------------
# Pane borders
# ---------------------------------------------------------------------------
set -g pane-border-style bg=$OC_BG,fg=$OC_BORDER
set -g pane-active-border-style bg=$OC_BG,fg=$OC_PRIMARY

# Messages
set -g message-style bg=$OC_PANEL,fg=$OC_TEXT
set -g message-command-style bg=$OC_PANEL,fg=$OC_TEXT

# ---------------------------------------------------------------------------
# Plugins (TPM)
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect / Continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Yank
set -g @yank_action 'copy-pipe'

# TPM path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'

# Initialize TPM (MUST be at the bottom)
run '~/.local/share/tmux/plugins/tpm/tpm'
